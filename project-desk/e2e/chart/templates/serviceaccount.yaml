{{- if and .Values.cronjob.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "project-desk-e2e.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "project-desk-e2e.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
