apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: project-desk
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: project-desk-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 47292
          env:
            - name: PORT
              value: "47292"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: project-desk-postgres
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 47292
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: project-desk
spec:
  selector:
    app: api
  ports:
    - port: 47292
      targetPort: 47292
