apiVersion: v1
kind: ConfigMap
metadata:
  name: project-desk-nginx
  namespace: project-desk
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 256;

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location /api/ {
            resolver kube-dns.kube-system.svc.cluster.local valid=10s;
            set $api_upstream api.project-desk.svc.cluster.local:47292;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: project-desk
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: project-desk-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: project-desk-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: project-desk
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30091
