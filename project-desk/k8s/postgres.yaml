apiVersion: v1
kind: Secret
metadata:
  name: project-desk-postgres
  namespace: project-desk
type: Opaque
stringData:
  POSTGRES_USER: projectdesk
  POSTGRES_PASSWORD: projectdesk
  POSTGRES_DB: projectdesk
  DATABASE_URL: postgres://projectdesk:projectdesk@postgres:5432/projectdesk?sslmode=disable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: project-desk
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: project-desk-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-desk-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: project-desk-postgres
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "projectdesk", "-d", "projectdesk"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: project-desk-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: project-desk
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
