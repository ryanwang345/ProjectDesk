services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projectdesk
      POSTGRES_PASSWORD: projectdesk
      POSTGRES_DB: projectdesk
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectdesk -d projectdesk"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
      secrets:
        - extra-ca
    environment:
      DATABASE_URL: postgres://projectdesk:projectdesk@postgres:5432/projectdesk?sslmode=disable
      PORT: "47292"
      # Encrypts provider API keys at rest. Change this for anything shared;
      # rotating it means re-entering provider keys under AI Settings.
      PROJECT_DESK_SECRET_KEY: ${PROJECT_DESK_SECRET_KEY:-local-compose-only-change-me}
      # Optional bearer token for AI settings changes (providers, agents).
      PROJECT_DESK_ADMIN_TOKEN: ${PROJECT_DESK_ADMIN_TOKEN:-}
      # The API container has no Docker daemon, so sandboxed test runs report
      # "not run" here. Run the API on a host with Docker to enable them.
      PROJECT_DESK_RUNNER: none
      PROJECT_DESK_WORKER_CONCURRENCY: "2"
    ports:
      - "47292:47292"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    ports:
      - "47291:80"
    depends_on:
      - api

# Public CA bundle for TLS interception, used only while apk installs git.
# Empty on a network that does not intercept. Never a private key.
# Recreate it on a Netskope machine with:
#   echo | openssl s_client -showcerts -connect dl-cdn.alpinelinux.org:443 -servername dl-cdn.alpinelinux.org 2>/dev/null | awk 'BEGIN{n=0} /BEGIN CERT/{n++; if(n==1) next} n>=2 && n<=4' > server/extra-ca.crt
secrets:
  extra-ca:
    file: ./server/extra-ca.crt
