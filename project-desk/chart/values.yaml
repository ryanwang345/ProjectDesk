postgres:
  image: postgres:16-alpine
  pullPolicy: IfNotPresent
  user: projectdesk
  password: projectdesk
  database: projectdesk
  storage: 1Gi
  fsGroup: 70
  backup:
    enabled: true
    schedule: "0 8 * * *"
    keep: 7
    storage: 1Gi

api:
  image: docker.io/rwang345/project-desk-api
  tag: "latest"
  pullPolicy: IfNotPresent
  port: 47292

web:
  image: docker.io/rwang345/project-desk-web
  tag: "latest"
  pullPolicy: IfNotPresent
