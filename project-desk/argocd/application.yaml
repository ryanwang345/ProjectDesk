apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-desk
  namespace: argocd
spec:
  project: project-desk
  source:
    repoURL: https://github.com/ryanwang345/ProjectDesk.git
    targetRevision: main
    path: project-desk/chart
    helm:
      releaseName: project-desk
      valueFiles:
        - values.yaml
  destination:
    name: in-cluster
    namespace: rwang
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
