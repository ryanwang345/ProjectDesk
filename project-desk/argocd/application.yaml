apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-desk
  namespace: rwang
  labels:
    app.vailsys.com/name: project-desk
    dept.vailsys.com/name: personal-namespace
    team.vailsys.com/name: personal-namespace
spec:
  project: syseng
  source:
    repoURL: https://github.com/ryanwang345/ProjectDesk.git
    targetRevision: main
    path: project-desk/chart
    helm:
      releaseName: project-desk
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rwang
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - ApplyOutOfSyncOnly=true
