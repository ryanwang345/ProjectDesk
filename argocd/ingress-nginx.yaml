# Industry Standard GitOps: Manage ingress-nginx controller declaratively via ArgoCD
# with hostNetwork: true permanently enforced as code.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.*
    helm:
      valuesObject:
        controller:
          # Binds ingress-nginx directly to the VM's physical ports 80 and 443
          hostNetwork: true
          # Required with hostNetwork so the controller can resolve internal cluster DNS (*.svc.cluster.local)
          dnsPolicy: ClusterFirstWithHostNet
          service:
            # When hostNetwork is enabled, NodePort/LoadBalancer is no longer needed
            type: ClusterIP
          publishService:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
